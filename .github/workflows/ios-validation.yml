name: iOS Validation

# StuDev.AotAnywhere.Apple end to end, from every host family:
#   zig      - zig 0.17.0 with eng/zig-patches applied, cross-built on Linux for Linux, macOS and
#              Windows hosts (eng/build-patched-zig.sh; cached on the patches, so only a patch
#              change rebuilds it).
#   build    - on Linux, Windows and macOS: the Apple tools and the MSBuild tests, then
#              test/ios/IBTest (storyboards, asset catalog) for the simulator and as a device app
#              signed with a throwaway identity, linked by that host's patched zig.
#   validate - on a Mac: Apple's codesign checks every host's apps, each simulator build runs its
#              storyboard self-tests in a simulator, and the signed .ipa files are inspected.
# These are local-development builds; App Store distribution is out of scope (see the README).

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'src/Apple/**'
      - 'src/ZigResolve.targets'
      - 'eng/zig-patches/**'
      - 'eng/build-patched-zig.sh'
      - 'test/ios/**'
      - 'tests/**'
      - '.github/workflows/ios-validation.yml'
  push:
    branches: [ ios-support ]
    paths:
      - 'src/Apple/**'
      - 'src/ZigResolve.targets'
      - 'eng/zig-patches/**'
      - 'eng/build-patched-zig.sh'
      - 'test/ios/**'
      - 'tests/**'
      - '.github/workflows/ios-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.17.0
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  zig:
    name: Patched zig
    runs-on: depot-ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Restore patched zig
        id: cache
        uses: actions/cache@v6
        with:
          path: out/zig
          key: zig-patched-${{ env.ZIG_VERSION }}-${{ hashFiles('eng/zig-patches/**', 'eng/build-patched-zig.sh') }}

      - name: Build patched zig for Linux, macOS and Windows hosts
        if: steps.cache.outputs.cache-hit != 'true'
        run: eng/build-patched-zig.sh out/zig x86_64-linux-musl aarch64-macos-none x86_64-windows-gnu

      - name: Check the patch's behaviour
        run: |
          set -eu
          tar xzf out/zig/zig-x86_64-linux-musl.tar.gz -C "$RUNNER_TEMP"
          zig="$RUNNER_TEMP/zig-x86_64-linux-musl/zig"
          "$zig" version
          cd "$RUNNER_TEMP"
          printf 'int keep_me(void){return 1;}\nint hide_me(void){return 2;}\n' > t.c
          echo _keep_me > t.exports
          "$zig" cc -target aarch64-macos -shared t.c -Wl,-exported_symbols_list,t.exports -o t.dylib
          "$zig" cc -target aarch64-macos -shared t.c -o t-all.dylib
          # With the list only _keep_me is exported, so the export tries differ.
          if cmp -s t.dylib t-all.dylib; then echo "the exports list had no effect"; exit 1; fi

      - uses: actions/upload-artifact@v7
        with:
          name: zig-patched
          path: out/zig/zig-*
          if-no-files-found: error

  build:
    name: Build on ${{ matrix.host }}
    needs: zig
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux
            runner: depot-ubuntu-latest
            zig: x86_64-linux-musl
          - host: windows
            runner: depot-windows-latest
            zig: x86_64-windows-gnu
          - host: macos
            runner: depot-macos-latest
            zig: aarch64-macos-none
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/download-artifact@v8
        with:
          name: zig-patched
          path: zig

      - name: Put the patched zig on PATH
        run: |
          set -eu
          cd zig
          case "${{ matrix.zig }}" in
            *-windows-*) unzip -q "zig-${{ matrix.zig }}.zip"; cygpath -w "$PWD/zig-${{ matrix.zig }}" >> "$GITHUB_PATH" ;;
            *)           tar xzf "zig-${{ matrix.zig }}.tar.gz"; echo "$PWD/zig-${{ matrix.zig }}" >> "$GITHUB_PATH" ;;
          esac

      - name: Install the iOS workload
        run: |
          zig version
          dotnet workload install ios
          dotnet workload list

      - name: Build the Apple tools
        run: dotnet build src/Apple/tools/AotAnywhere.AppleTools -c Release

      - name: MSBuild tests
        run: dotnet run --project tests/AotAnywhere.MSBuild.Tests -c Release

      - name: Throwaway signing identity
        run: test/ios/make-test-signing.sh "$RUNNER_TEMP/signing"

      # UseExternalZig: link with the patched zig on PATH, not the NuGet toolset.
      # AotAnywhereAppleForce: use the package's tools even on a Mac with Xcode.
      - name: Simulator build
        run: |
          dotnet build test/ios/IBTest -c Release -r iossimulator-arm64 -p:_IsPublishing=true \
            -p:UseExternalZig=true -p:AotAnywhereAppleForce=true

      - name: Signed device build
        run: |
          s="$RUNNER_TEMP/signing"
          dotnet publish test/ios/IBTest -c Release -r ios-arm64 -p:UseExternalZig=true -p:AotAnywhereAppleForce=true \
            -p:AotAnywhereSignP12File="$s/dev.p12" -p:AotAnywhereSignP12PasswordFile="$s/dev.p12.password" \
            -p:AotAnywhereProvisioningProfile="$s/test.mobileprovision"

      - name: Collect
        run: |
          set -eu
          mkdir -p out
          tar czf out/IBTest-sim.tar.gz -C test/ios/IBTest/bin/Release/net10.0-ios/iossimulator-arm64 IBTest.app
          cp test/ios/IBTest/bin/Release/net10.0-ios/ios-arm64/publish/IBTest.ipa out/

      - uses: actions/upload-artifact@v7
        with:
          name: ios-${{ matrix.host }}
          path: out/
          if-no-files-found: error

  validate:
    name: Run on a Mac
    needs: build
    if: ${{ !cancelled() }}
    runs-on: depot-macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: ios-*
          path: apps

      - name: Boot a simulator
        id: sim
        run: |
          set -eu
          udid=$(python3 - <<'PY'
          import json, subprocess
          runtimes = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "runtimes", "-j"]))["runtimes"]
          ios = [r for r in runtimes if r.get("platform") == "iOS" and r.get("isAvailable")]
          runtime = max(ios, key=lambda r: [int(x) for x in r["version"].split(".")])
          phone = next(d for d in runtime["supportedDeviceTypes"] if d["productFamily"] == "iPhone")
          print(subprocess.check_output(["xcrun", "simctl", "create", "aotanywhere-ci", phone["identifier"], runtime["identifier"]], text=True).strip())
          PY
          )
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Check and run every host's apps
        run: |
          set -u
          fail=0
          for host in linux windows macos; do
            echo "::group::$host"
            dir="apps/ios-$host"
            if [ ! -d "$dir" ]; then echo "FAIL $host: no build"; fail=1; echo "::endgroup::"; continue; fi

            # Simulator app: signature, then the storyboard self-tests. Windows records no Unix
            # modes, so make the Mach-O files executable as the simulator installer expects.
            mkdir -p "$dir/sim" && tar xzf "$dir/IBTest-sim.tar.gz" -C "$dir/sim"
            app="$dir/sim/IBTest.app"
            find "$app" -type f -exec sh -c 'file -b "$1" | grep -q Mach-O && chmod +x "$1"' _ {} \;
            if codesign --verify --deep --strict "$app"; then echo "ok    $host simulator signature"; else echo "FAIL  $host simulator signature"; fail=1; fi
            for f in Assets.car Showcase.storyboardc Controls.storyboardc Tabbed.storyboardc; do
              [ -e "$app/$f" ] || { echo "FAIL  $host simulator app has no $f"; fail=1; }
            done
            python3 test/ios/run-sim.py "${{ steps.sim.outputs.udid }}" "$app" || fail=1

            # Device .ipa: modes, profile and identity. The test identity is self-signed, so
            # codesign reports the signature valid but not the designated requirement.
            ipa="$dir/IBTest.ipa"
            zipinfo "$ipa" Payload/IBTest.app/IBTest | grep -q '^-rwxr-xr-x' || { echo "FAIL  $host .ipa executable is not 0755"; fail=1; }
            mkdir -p "$dir/device" && ditto -x -k "$ipa" "$dir/device"
            dev="$dir/device/Payload/IBTest.app"
            [ -f "$dev/embedded.mobileprovision" ] || { echo "FAIL  $host .ipa has no embedded.mobileprovision"; fail=1; }
            verify=$(codesign --verify --deep --strict -vv "$dev" 2>&1)
            echo "$verify"
            echo "$verify" | grep -q 'valid on disk' || { echo "FAIL  $host device signature"; fail=1; }
            codesign -dvv "$dev" 2>&1 | grep -q 'Authority=Apple Development: AotAnywhere CI' || { echo "FAIL  $host device signer"; fail=1; }
            echo "::endgroup::"
          done
          exit $fail

name: iOS Validation

# StuDev.AotAnywhere.Apple end to end, from every host family:
#   zig      - zig with eng/zig-patches applied, cross-built on Linux for Linux, macOS and Windows
#              hosts (eng/build-patched-zig.sh): the pinned release, and zig master as an early
#              warning (cached on the resolved version and the patches).
#   build    - on Linux, Windows and macOS, for each supported iOS workload version (pinned with a
#              rollback file): the Apple tools, then test/ios/IBTest (storyboards, asset catalog)
#              for the simulator and as a device app signed with a throwaway identity, linked by
#              that host's patched zig; and once per host with the stock zig the packages bring
#              from NuGet (Vezel.Zig.Toolsets, zig: nuget), as consumers build. The MSBuild tests
#              run once per host.
#   validate - on a Mac: Apple's codesign checks every build's apps, each simulator build runs its
#              self-tests in a simulator, and the signed .ipa files are inspected.
# Experimental entries (zig master, the newest unpinned workload) are reported but don't fail the
# run. These are local-development builds; App Store distribution is out of scope (see the README).
#
# Runners are GitHub-hosted by default; set the repository variables IOS_LINUX_RUNNER,
# IOS_WINDOWS_RUNNER and IOS_MACOS_RUNNER (e.g. depot-ubuntu-latest) to use others.

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'src/Apple/**'
      - 'src/ZigResolve.targets'
      - 'eng/zig-patches/**'
      - 'eng/build-patched-zig.sh'
      - 'eng/generate-apple-ios-sysroot.cs'
      - 'test/ios/**'
      - 'tests/**'
      - '.github/workflows/ios-validation.yml'
  push:
    branches: [ ios-support ]
    paths:
      - 'src/Apple/**'
      - 'src/ZigResolve.targets'
      - 'eng/zig-patches/**'
      - 'eng/build-patched-zig.sh'
      - 'eng/generate-apple-ios-sysroot.cs'
      - 'test/ios/**'
      - 'tests/**'
      - '.github/workflows/ios-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  zig:
    name: Patched zig ${{ matrix.zig }}
    runs-on: ${{ vars.IOS_LINUX_RUNNER || 'ubuntu-latest' }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - zig: '0.17.0'
            experimental: false
          - zig: master
            experimental: true
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the zig version
        id: resolve
        run: |
          version=$(curl -sSfL https://ziglang.org/download/index.json | python3 -c "
          import json, sys
          index, want = json.load(sys.stdin), sys.argv[1]
          print(index['master']['version'] if want == 'master' else want)" "${{ matrix.zig }}")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zig ${{ matrix.zig }} is $version"

      - name: Restore patched zig
        id: cache
        uses: actions/cache@v6
        with:
          path: out/zig
          key: zig-patched-${{ steps.resolve.outputs.version }}-${{ hashFiles('eng/zig-patches/**', 'eng/build-patched-zig.sh') }}

      - name: Build patched zig for Linux, macOS and Windows hosts
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          ZIG_VERSION: ${{ steps.resolve.outputs.version }}
        run: eng/build-patched-zig.sh out/zig x86_64-linux-musl aarch64-macos-none x86_64-windows-gnu

      - name: Check the patch's behaviour
        run: |
          set -eu
          tar xzf out/zig/zig-x86_64-linux-musl.tar.gz -C "$RUNNER_TEMP"
          zig="$RUNNER_TEMP/zig-x86_64-linux-musl/zig"
          "$zig" version
          cd "$RUNNER_TEMP"
          printf 'int keep_me(void){return 1;}\nint hide_me(void){return 2;}\n' > t.c
          echo _keep_me > t.exports
          "$zig" cc -target aarch64-macos -shared t.c -Wl,-exported_symbols_list,t.exports -o t.dylib
          "$zig" cc -target aarch64-macos -shared t.c -o t-all.dylib
          # With the list only _keep_me is exported, so the export tries differ.
          if cmp -s t.dylib t-all.dylib; then echo "the exports list had no effect"; exit 1; fi

      - uses: actions/upload-artifact@v7
        with:
          name: zig-patched-${{ matrix.zig }}
          path: out/zig/zig-*
          if-no-files-found: error

  build:
    name: ${{ matrix.host }} / iOS ${{ matrix.workload }} / zig ${{ matrix.zig }}
    needs: zig
    if: ${{ !cancelled() }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        host: [ linux, windows, macos ]
        # Microsoft.iOS.Sdk versions (the workload's iOS manifest); keep in step with the
        # workloads eng/generate-apple-ios-sysroot.cs builds the link stubs from.
        workload: [ '26.0.11017', '26.5.10318', '27.0.10722' ]
        zig: [ '0.17.0' ]
        experimental: [ false ]
        # Workloads before 26.5 compile storyboards and asset catalogs through /usr/bin/xcrun,
        # so off a Mac they can't build IBTest (the package stops with an error saying so).
        exclude:
          - { host: linux, workload: '26.0.11017' }
          - { host: windows, workload: '26.0.11017' }
        include:
          - { host: linux, runner: "${{ vars.IOS_LINUX_RUNNER || 'ubuntu-latest' }}", target: x86_64-linux-musl }
          - { host: windows, runner: "${{ vars.IOS_WINDOWS_RUNNER || 'windows-latest' }}", target: x86_64-windows-gnu }
          - { host: macos, runner: "${{ vars.IOS_MACOS_RUNNER || 'macos-latest' }}", target: aarch64-macos-none }
          # The stock zig from NuGet that consumers get (the patches only matter for an opt-in).
          - { host: linux, runner: "${{ vars.IOS_LINUX_RUNNER || 'ubuntu-latest' }}", target: x86_64-linux-musl, workload: '27.0.10722', zig: nuget, experimental: false }
          - { host: windows, runner: "${{ vars.IOS_WINDOWS_RUNNER || 'windows-latest' }}", target: x86_64-windows-gnu, workload: '27.0.10722', zig: nuget, experimental: false }
          - { host: macos, runner: "${{ vars.IOS_MACOS_RUNNER || 'macos-latest' }}", target: aarch64-macos-none, workload: '27.0.10722', zig: nuget, experimental: false }
          # Early warnings: zig master, and whatever iOS workload is newest.
          - { host: linux, runner: "${{ vars.IOS_LINUX_RUNNER || 'ubuntu-latest' }}", target: x86_64-linux-musl, workload: '27.0.10722', zig: master, experimental: true }
          - { host: windows, runner: "${{ vars.IOS_WINDOWS_RUNNER || 'windows-latest' }}", target: x86_64-windows-gnu, workload: '27.0.10722', zig: master, experimental: true }
          - { host: macos, runner: "${{ vars.IOS_MACOS_RUNNER || 'macos-latest' }}", target: aarch64-macos-none, workload: '27.0.10722', zig: master, experimental: true }
          - { host: linux, runner: "${{ vars.IOS_LINUX_RUNNER || 'ubuntu-latest' }}", target: x86_64-linux-musl, workload: latest, zig: '0.17.0', experimental: true }
          - { host: windows, runner: "${{ vars.IOS_WINDOWS_RUNNER || 'windows-latest' }}", target: x86_64-windows-gnu, workload: latest, zig: '0.17.0', experimental: true }
          - { host: macos, runner: "${{ vars.IOS_MACOS_RUNNER || 'macos-latest' }}", target: aarch64-macos-none, workload: latest, zig: '0.17.0', experimental: true }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        env:
          # Linux: a .NET install the iOS packs can be written into (the default is root's).
          DOTNET_INSTALL_DIR: ${{ matrix.host == 'linux' && format('{0}/dotnet', runner.temp) || '' }}
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/download-artifact@v8
        if: matrix.zig != 'nuget'
        with:
          name: zig-patched-${{ matrix.zig }}
          path: zig

      - name: Put the patched zig on PATH
        if: matrix.zig != 'nuget'
        run: |
          set -eu
          cd zig
          case "${{ matrix.target }}" in
            *-windows-*) unzip -q "zig-${{ matrix.target }}.zip"; cygpath -w "$PWD/zig-${{ matrix.target }}" >> "$GITHUB_PATH" ;;
            *)           tar xzf "zig-${{ matrix.target }}.tar.gz"; echo "$PWD/zig-${{ matrix.target }}" >> "$GITHUB_PATH" ;;
          esac

      - name: Install the iOS workload ${{ matrix.workload }}
        run: |
          set -eu
          [ "${{ matrix.zig }}" = nuget ] || zig version
          if [ "${{ matrix.host }}" = linux ]; then
            # `dotnet workload install ios` refuses Linux (the workload extends Mono's iOS AOT
            # compilers, which only exist for macOS and Windows); Native AOT doesn't need them.
            eng/install-ios-packs.sh "${{ matrix.workload }}"
          elif [ "${{ matrix.workload }}" = latest ]; then
            dotnet workload install ios
          else
            # A rollback file pins the iOS manifest; the 10.0.100 band serves every 10.0 SDK.
            dotnet workload config --update-mode manifests
            echo '{ "microsoft.net.sdk.ios": "${{ matrix.workload }}/10.0.100" }' > "$RUNNER_TEMP/rollback.json"
            dotnet workload install ios --from-rollback-file "$RUNNER_TEMP/rollback.json"
          fi
          dotnet workload list || true

      - name: Build the Apple tools
        run: dotnet build src/Apple/tools/AotAnywhere.AppleTools -c Release

      - name: MSBuild tests
        if: matrix.workload == '27.0.10722' && matrix.zig == '0.17.0'
        run: dotnet run --project tests/AotAnywhere.MSBuild.Tests -c Release

      - name: Throwaway signing identity
        run: test/ios/make-test-signing.sh "$RUNNER_TEMP/signing"

      # UseExternalZig: link with the patched zig on PATH, not the NuGet toolset (zig: nuget uses that).
      # AotAnywhereAppleForce: use the package's tools even on a Mac with Xcode.
      - name: Simulator build
        run: |
          dotnet build test/ios/IBTest -c Release -r iossimulator-arm64 -p:_IsPublishing=true \
            -p:UseExternalZig=${{ matrix.zig != 'nuget' }} -p:AotAnywhereAppleForce=true

      - name: Signed device build
        run: |
          s="$RUNNER_TEMP/signing"
          dotnet publish test/ios/IBTest -c Release -r ios-arm64 -p:UseExternalZig=${{ matrix.zig != 'nuget' }} -p:AotAnywhereAppleForce=true \
            -p:AotAnywhereSignP12File="$s/dev.p12" -p:AotAnywhereSignP12PasswordFile="$s/dev.p12.password" \
            -p:AotAnywhereProvisioningProfile="$s/test.mobileprovision"

      - name: Collect
        run: |
          set -eu
          mkdir -p out
          tar czf out/IBTest-sim.tar.gz -C test/ios/IBTest/bin/Release/net10.0-ios/iossimulator-arm64 IBTest.app
          cp test/ios/IBTest/bin/Release/net10.0-ios/ios-arm64/publish/IBTest.ipa out/
          echo "${{ matrix.experimental }}" > out/experimental

      - uses: actions/upload-artifact@v7
        with:
          name: ios-${{ matrix.host }}-${{ matrix.workload }}-zig-${{ matrix.zig }}
          path: out/
          if-no-files-found: error

  validate:
    name: Run on a Mac
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ${{ vars.IOS_MACOS_RUNNER || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: ios-*
          path: apps

      - name: Boot a simulator
        id: sim
        run: |
          set -eu
          udid=$(python3 - <<'PY'
          import json, subprocess
          runtimes = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "runtimes", "-j"]))["runtimes"]
          ios = [r for r in runtimes if r.get("platform") == "iOS" and r.get("isAvailable")]
          runtime = max(ios, key=lambda r: [int(x) for x in r["version"].split(".")])
          phone = next(d for d in runtime["supportedDeviceTypes"] if d["productFamily"] == "iPhone")
          print(subprocess.check_output(["xcrun", "simctl", "create", "aotanywhere-ci", phone["identifier"], runtime["identifier"]], text=True).strip())
          PY
          )
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Check and run every build's apps
        run: |
          # Not -e: each build's failures are recorded and reported, and the loop checks the next.
          set +e -u
          fail=0
          rows=()
          # Every required build must be here; experimental ones may be missing.
          for host in linux windows macos; do
            for workload in 26.0.11017 26.5.10318 27.0.10722; do
              [ "$workload" = 26.0.11017 ] && [ "$host" != macos ] && continue  # excluded in the build matrix
              if [ ! -d "apps/ios-$host-$workload-zig-0.17.0" ]; then
                echo "FAIL $host / iOS $workload: no build"; rows+=("| $host | $workload | 0.17.0 | **no build** |"); fail=1
              fi
            done
            if [ ! -d "apps/ios-$host-27.0.10722-zig-nuget" ]; then
              echo "FAIL $host / iOS 27.0.10722 / NuGet zig: no build"; rows+=("| $host | 27.0.10722 | nuget | **no build** |"); fail=1
            fi
          done
          for dir in apps/ios-*; do
            name=${dir#apps/ios-}
            experimental=$(cat "$dir/experimental" 2>/dev/null || echo false)
            echo "::group::$name"
            bad=0

            # Simulator app: signature, then the self-tests. Windows records no Unix modes, so
            # make the Mach-O files executable as the simulator installer expects.
            mkdir -p "$dir/sim" && tar xzf "$dir/IBTest-sim.tar.gz" -C "$dir/sim"
            app="$dir/sim/IBTest.app"
            find "$app" -type f -exec sh -c 'file -b "$1" | grep -q Mach-O && chmod +x "$1"' _ {} \;
            codesign --verify --deep --strict "$app" || { echo "FAIL simulator signature"; bad=1; }
            for f in Assets.car Showcase.storyboardc Controls.storyboardc Tabbed.storyboardc; do
              [ -e "$app/$f" ] || { echo "FAIL simulator app has no $f"; bad=1; }
            done
            python3 test/ios/run-sim.py "${{ steps.sim.outputs.udid }}" "$app" || bad=1

            # Device .ipa: modes, profile and identity. The test identity is self-signed, so
            # codesign reports the signature valid but not the designated requirement.
            ipa="$dir/IBTest.ipa"
            zipinfo "$ipa" Payload/IBTest.app/IBTest | grep -q '^-rwxr-xr-x' || { echo "FAIL .ipa executable is not 0755"; bad=1; }
            mkdir -p "$dir/device" && ditto -x -k "$ipa" "$dir/device"
            dev="$dir/device/Payload/IBTest.app"
            [ -f "$dev/embedded.mobileprovision" ] || { echo "FAIL .ipa has no embedded.mobileprovision"; bad=1; }
            # (Exit status 3 for the unmet designated requirement; the output is what's checked.)
            verify=$(codesign --verify --deep --strict -vv "$dev" 2>&1) || true
            echo "$verify"
            echo "$verify" | grep -q 'valid on disk' || { echo "FAIL device signature"; bad=1; }
            codesign -dvv "$dev" 2>&1 | grep -q 'Authority=Apple Development: AotAnywhere CI' || { echo "FAIL device signer"; bad=1; }
            echo "::endgroup::"

            host=${name%%-*}; rest=${name#*-}; workload=${rest%%-zig-*}; zig=${rest##*-zig-}
            result=$([ $bad = 0 ] && echo ok || echo '**failed**')
            [ "$experimental" = true ] && result="$result (experimental)"
            rows+=("| $host | $workload | $zig | $result |")
            if [ $bad != 0 ] && [ "$experimental" != true ]; then fail=1; fi
          done
          { echo "| host | iOS workload | zig | result |"; echo "|---|---|---|---|"; printf '%s\n' "${rows[@]}"; } >> "$GITHUB_STEP_SUMMARY"
          exit $fail
